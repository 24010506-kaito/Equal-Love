<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>=LOVE風サイト</title>
    <style>
        body {
            margin: 0;
            font-family: 'Helvetica', 'Arial', sans-serif;
            background: #ffffff;
            color: #333;
        }
        header {
            background: #ff66a5;
            padding: 20px;
            text-align: center;
            color: white;
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 2px;
        }
        nav {
            display: flex;
            justify-content: center;
            gap: 30px;
            padding: 15px;
            background: #fff;
            border-bottom: 1px solid #eee;
            position: sticky;
            top: 0;
        }
        nav a {
            text-decoration: none;
            color: #ff66a5;
            font-weight: bold;
            font-size: 18px;
        }
        .hero {
            background: url(images/イコラブヘッダー.png) center/cover;
            height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 40px;
            font-weight: bold;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.6);
        }
        .section {
            padding: 50px 20px;
            max-width: 1000px;
            margin: auto;
        }
        .members {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            text-align: center;
        }
        .member-card {
            background: #fff;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .member-card img {
            width: 100%;
            border-radius: 12px;
        }
        footer {
            text-align: center;
            padding: 20px;
            background: #ff66a5;
            color: white;
            margin-top: 40px;
        }
    </style>
</head>
<body>

<header>君がイコラブに沼るまでにサイト</header>

<nav>
    <a href="#news">NEWS</a>
    <a href="#members">MEMBER</a>
    <a href="#media">MEDIA</a>
    <a href="#schedule">SCHEDULE</a>
</nav>

<div class="hero"></div>

<section class="section" id="news">
    <h2>NEWS</h2>
    <p>・最新情報をここに表示できます。</p>
    <p>・新曲リリース情報など。</p>
</section>

<section class="section" id="members">
    <h2>MEMBER</h2>
    <div class="members">
        <div class="member-card">
            <img src="images/大谷.jpg" alt="Member">
            <p>大谷映美里</p>
        </div>
        <div class="member-card">
            <img src="https://placehold.co/300x400?text=Member2" alt="Member">
            <p>大場花菜</p>
        </div>
        <div class="member-card">
            <img src="https://placehold.co/300x400?text=Member3" alt="Member">
            <p>音嶋莉沙</p>
        </div>
        <div class="member-card">
            <img src="https://placehold.co/300x400?text=Member4" alt="Member">
            <p>斎藤樹愛羅</p>
        </div>    
        <div class="member-card">
            <img src="https://placehold.co/300x400?text=Member5" alt="Member">
            <p>佐々木舞香</p>
        </div>    
        <div class="member-card">
            <img src="https://placehold.co/300x400?text=Member6" alt="Member">
            <p>高松瞳</p>
        </div>    
        <div class="member-card">
            <img src="https://placehold.co/300x400?text=Member7" alt="Member">
            <p>瀧脇笙古</p>
        </div>    
        <div class="member-card">
            <img src="https://placehold.co/300x400?text=Member8" alt="Member">
            <p>野口衣織</p>
        </div>    
        <div class="member-card">
            <img src="https://placehold.co/300x400?text=Member9" alt="Member">
            <p>諸橋沙夏</p>
        </div>    
        <div class="member-card">
            <img src="https://placehold.co/300x400?text=Member10" alt="Member">
            <p>山本杏奈</p>                        
        </div>
    </div>
</section>

<section class="section" id="media">
    <h2>MEDIA</h2>
    <p>YouTube / TV出演などの情報</p>
</section>

<section class="section" id="schedule">
    <h2>SCHEDULE</h2>
    <p>ライブ・イベントの日程</p>
</section>

<footer>© 2025 FAN MADE</footer>

</body>
</html>
